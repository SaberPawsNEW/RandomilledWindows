version: 2
updates:
  # 1. Keep your GitHub Actions dependencies up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2. Keep your project dependencies up to date (Example: Node.js/npm)
  - package-ecosystem: "npm" 
    directory: "/"
    schedule:
      interval: "weekly" # Options: daily, weekly, monthly
